<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraClient | A modpack for modern versions of Minecraft!</title>
    
    <!-- Einbindung der Minecraft-Schriftart und Google Fonts -->
    <link href="https://cdnfonts.com" rel="stylesheet">
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* Lunar Client Layout Nachbau */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #0b0b0d;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 🌲 Epischer Minecraft Shader Hintergrund im Lunar-Stil */
        .lunar-hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Hochauflösendes Minecraft Nacht-Shader Bild */
            background: linear-gradient(rgba(11, 11, 13, 0.4), rgba(11, 11, 13, 0.75)), 
                        url('https://unsplash.com') no-repeat center center;
            background-size: cover;
            z-index: -1;
            filter: brightness(0.85) contrast(1.05);
        }

        /* 📱 Die originale obere Menüleiste (Navbar) */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6%;
            background: #111115;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-box {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #8c52ff, #451a99);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Minecraftia', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .logo-title {
            font-family: 'Minecraftia', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            color: #ffffff;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 24px;
        }
        .nav-links a {
            color: #a3a3a3;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #ffffff;
        }
        .nav-links .locked {
            color: #4a4a4f;
            cursor: not-allowed;
        }

        /* 👑 Zentrierter Hauptbereich (Hero) */
        .hero-content {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        /* Großer Minecraft-Titel */
        .hero-content h1 {
            font-family: 'Minecraftia', sans-serif;
            font-size: 4.2rem;
            color: #ffffff;
            margin-bottom: 5px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            letter-spacing: -1px;
        }

        /* Slogan unter der Überschrift */
        .hero-content p {
            color: #e2e8f0;
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 35px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
        }

        /* 🎯 Die beiden Hauptbuttons genau wie Lunar */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .btn-download {
            background-color: #3b82f6;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: not-allowed;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            transition: background-color 0.2s;
        }

        .btn-tiktok {
            background-color: #ffffff;
            color: #111115;
            padding: 14px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-tiktok:hover {
            background-color: #f3f4f6;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Lunar Background -->
    <div class="lunar-hero-bg"></div>

    <!-- Menüleiste ganz oben -->
    <nav>
        <div class="logo-area">
            <div class="logo-box">U</div>
            <div class="logo-title">ULTRA CLIENT</div>
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#" class="locked"><i class="fa-solid fa-lock"></i> Store</a></li>
            <li><a href="#" class="locked"><i class="fa-solid fa-lock"></i> Cosmetics</a></li>
            <li><a href="https://tiktok.com" target="_blank">TikTok</a></li>
        </ul>
    </nav>

    <!-- Hauptbereich Mitte -->
    <div class="hero-content">
        <h1>ULTRA CLIENT</h1>
        <p>A modpack for all modern versions of Minecraft!</p>
        
        <div class="btn-group">
            <button class="btn-download" onclick="alert('Wir programmieren den Launcher aktuell im Hintergrund! Alle Infos auf TikTok!')">
                <i class="fa-solid fa-download"></i> Download
            </button>
            <a href="https://tiktok.com" target="_blank" class="btn-tiktok">
                <i class="fa-brands fa-tiktok"></i> TikTok Store
            </a>
        </div>
    </div>

</body>
</html>
