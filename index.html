<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraClient | Next-Gen Minecraft Client & Launcher</title>
    <!-- Einbindung der Minecraft-Schriftart und Google Fonts -->
    <link href="https://cdnfonts.com" rel="stylesheet">
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #05030f;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 🌌 Ultra-Krasse, animierte Galaxie im Hintergrund */
        .galaxy-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(140, 82, 255, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, #0d0722 0%, #05030f 100%);
            z-index: -2;
        }

        /* Animierte Nebelwolken */
        .nebula {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://transparenttextures.com') repeat;
            opacity: 0.3;
            animation: nebulaMove 120s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes nebulaMove {
            from { background-position: 0 0; }
            to { background-position: 1000px 500px; }
        }

        /* 🔗 Navigation Header */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(5, 3, 15, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(140, 82, 255, 0.15);
            z-index: 10;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #8c52ff, #00d4ff);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Minecraftia', sans-serif;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(140, 82, 255, 0.6);
        }
        .logo-text {
            font-family: 'Minecraftia', sans-serif;
            font-size: 1.5rem;
            background: linear-gradient(to right, #ffffff, #c3a6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 35px;
            align-items: center;
        }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-links a:hover {
            color: #8c52ff;
        }
        .nav-links .disabled-link {
            color: #4b4b5c;
            cursor: not-allowed;
        }
        .nav-links .disabled-link:hover {
            color: #4b4b5c;
        }

        /* 👑 Hauptinhalt */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 20px 60px 20px;
            position: relative;
            z-index: 5;
        }

        /* Glühender Status-Badge */
        .badge {
            background: rgba(140, 82, 255, 0.1);
            border: 1px solid rgba(140, 82, 255, 0.5);
            color: #d6c2ff;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
            text-transform: uppercase;
            box-shadow: 0 0 25px rgba(140, 82, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .hero h1 {
            font-family: 'Minecraftia', sans-serif;
            font-size: 5rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 30%, #8c52ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(140, 82, 255, 0.4));
        }

        .hero p {
            color: #94a3b8;
            font-size: 1.3rem;
            max-width: 650px;
            line-height: 1.6;
            margin-bottom: 45px;
        }

        /* 🎯 Premium Buttons */
        .btn-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 60px;
        }
        .btn-main {
            background: linear-gradient(135deg, #8c52ff, #00d4ff);
            color: #ffffff;
            padding: 18px 40px;
            font-size: 1.15rem;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(140, 82, 255, 0.5);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-main:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 45px rgba(0, 212, 255, 0.8);
        }
        .btn-tiktok {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            padding: 18px 35px;
            font-size: 1.15rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .btn-tiktok:hover {
            background: #ff0050;
            border-color: #ff0050;
            transform: translateY(-4px);
            box-shadow: 0 0 30px rgba(255, 0, 80, 0.5);
        }

        /* 📊 Premium Statistik-Boxen (Lunar Style) */
        .stats-container {
            display: flex;
            gap: 40px;
            background: rgba(255, 255, 255, 0.02);
            padding: 25px 60px;
            border-radius: 24px;
            border: 1px solid rgba(140, 82, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .stat-box {
            text-align: center;
            position: relative;
        }
        .stat-val {
            font-size: 2.2rem;
            font-weight: 800;
            color: #00d4ff;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }
        .stat-lbl {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- 🌌 Krasser Galaxie Hintergrund -->
    <div class="galaxy-bg"></div>
    <div class="nebula"></div>

    <!-- 🔗 Navigationsleiste -->
    <nav>
        <div class="logo-area">
            <div class="logo-icon">U</div>
            <div class="logo-text">UltraClient</div>
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#" class="disabled-link"><i class="fa-solid fa-lock"></i> Cosmetics</a></li>
            <li><a href="#" class="disabled-link"><i class="fa-solid fa-lock"></i> Store</a></li>
            <!-- Dein echter TikTok Link -->
            <li><a href="https://www.tiktok.com/@ultraclient2026" target="_blank"><i class="fa-brands fa-tiktok"></i> TikTok</a></li>
        </ul>
    </nav>

    <!-- 👑 Hauptseite -->
    <div class="hero">
        <div class="badge">🛸 COMING SOON - PROJEKT GESTARTET</div>
        <h1>UltraClient</h1>
        <p>Hol dir den ultimativen Minecraft Launcher & Client. Atemberaubende FPS-Boosts, optimierte Performance und exklusive Cosmetics, die bald erscheinen.</p>
        
        <div class="btn-container">
            <button class="btn-main" onclick="alert('Wir programmieren den Launcher aktuell im Hintergrund! Schau auf TikTok vorbei für Updates!')">
                <i class="fa-solid fa-code"></i> Launcher In Arbeit
            </button>
            
            <!-- Dein TikTok Button führt jetzt direkt zu deinem Account -->
            <a href="https://www.tiktok.com/@ultraclient2026" target="_blank" class="btn-tiktok">
                <i class="fa-brands fa-tiktok"></i> Unser TikTok
            </a>
        </div>

        <!-- Stats Leiste -->
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-val">+45%</div>
                <div class="stat-lbl">Mehr FPS</div>
            </div>
