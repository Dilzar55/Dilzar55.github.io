<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraClient | Minecraft that feels like it's truly built just for you.</title>
    
    <!-- Original Minecraft Pixel-Schriftart -->
    <link href="https://cdnfonts.com" rel="stylesheet">
    <!-- Cleanere Schriftart für die Untertexte -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Icons für den Download und TikTok -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* 1:1 NoRisk Client Minimalist Layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #09090b; /* Tiefschwarzer, edler Hintergrund */
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 📱 Die minimalistische obere Leiste */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 6%;
            z-index: 100;
        }
        .menu-btn {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
            cursor: pointer;
        }
        .menu-btn:hover {
            color: #ffffff;
        }

        /* ⚡ Das leuchtende Blitz-Symbol oben in der Mitte */
        .top-flash {
            font-size: 1.5rem;
            color: #9333ea;
            filter: drop-shadow(0 0 10px rgba(147, 51, 234, 0.6));
            animation: flashPulse 3s infinite ease-in-out;
        }

        @keyframes flashPulse {
            0% { opacity: 0.6; filter: drop-shadow(0 0 5px rgba(147, 51, 234, 0.4)); }
            50% { opacity: 1; filter: drop-shadow(0 0 15px rgba(147, 51, 234, 0.9)); }
            100% { opacity: 0.6; filter: drop-shadow(0 0 5px rgba(147, 51, 234, 0.4)); }
        }

        /* 👑 Haupt-Inhaltsbereich (Zentriert) */
        .main-content {
            text-align: center;
            padding: 0 20px;
            max-width: 800px;
            margin-top: 40px;
        }

        /* Genaue Minecraft-Schriftart-Anordnung wie bei NoRisk */
        .main-content h1 {
            font-family: 'Minecraftia', sans-serif;
            font-size: 2.8rem;
            line-height: 1.4;
            font-weight: normal;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }
        
        /* Das lila leuchtende Wort am Ende des Satzes */
        .purple-glow-text {
            color: #a855f7;
            text-shadow: 0 0 25px rgba(168, 85, 247, 0.45);
        }

        /* Kleiner, eleganter Untertext */
        .main-content p {
            color: #71717a;
            font-size: 1.05rem;
            line-height: 1.6;
            max-width: 520px;
            margin: 0 auto 45px auto;
        }

        /* 🎯 Die NoRisk Style Buttons */
        .button-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn-norisk {
            background-color: #9333ea;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 500;
            padding: 14px 32px;
            border: none;
            border-radius: 30px; /* Perfekt abgerundet wie auf dem Bild */
            cursor: not-allowed;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        .btn-tiktok-sub {
            color: #71717a;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }
        .btn-tiktok-sub:hover {
            color: #ff0050;
            text-shadow: 0 0 10px rgba(255, 0, 80, 0.3);
        }
    </style>
</head>
<body>

    <!-- Minimalistische Leiste oben -->
    <nav>
        <div class="menu-btn"><i class="fa-solid fa-bars"></i> Menu</div>
        <!-- Der originale leuchtende NoRisk Blitz -->
        <div class="top-flash"><i class="fa-solid fa-bolt"></i></div>
        <div style="width: 70px;"></div> <!-- Ausgleich für das Layout links -->
    </nav>

    <!-- Hauptinhalt genau im Stil des Screenshots -->
    <div class="main-content">
        <h1>Minecraft that feels like it's truly <span class="purple-glow-text">built just for you.</span></h1>
        <p>Everything you need to make Minecraft feel fresh, personal, and exciting again.</p>
        
        <div class="button-wrapper">
            <!-- Großer, abgerundeter Hauptbutton -->
            <button class="btn-norisk" onclick="alert('UltraClient wird aktuell im Hintergrund programmiert! Verfolge die Updates auf TikTok!')">
                <i class="fa-solid fa-download"></i> Start Playing
            </button>
            
            <!-- Eleganter TikTok-Link darunter -->
            <a href="https://tiktok.com" target="_blank" class="btn-tiktok-sub">
                <i class="fa-brands fa-tiktok"></i> Follow @ultraclient2026 for Dev-Logs
            </a>
        </div>
    </div>

</body>
</html>
