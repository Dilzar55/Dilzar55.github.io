<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraClient | Next-Gen Minecraft Client & Launcher</title>
    <!-- Einbindung der Minecraft-Schriftart und Google Fonts -->
    <link href="https://cdnfonts.com" rel="stylesheet">
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- FontAwesome für coole Social-Media-Icons (Discord, TikTok) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* Modernes, dunkles Lunar-Style Design */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }
        /* Partikel-Hintergrund-Effekt */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Navigation (Obere Leiste) */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(11, 11, 14, 0.75);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        /* Cooles, leuchtendes Logo-Symbol */
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Minecraftia', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }
        .logo-text {
            font-family: 'Minecraftia', sans-serif;
            font-size: 1.4rem;
            background: linear-gradient(to right, #ffffff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: #a855f7;
        }
        /* Hauptbereich */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            z-index: 5;
        }
        .badge {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #c084fc;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.1);
        }
        .hero h1 {
            font-family: 'Minecraftia', sans-serif;
            font-size: 4.5rem;
            margin-bottom: 20px;
            letter-spacing: -1px;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }
        .hero p {
            color: #94a3b8;
            font-size: 1.3rem;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        /* Buttons nebeneinander */
        .btn-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-main {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #ffffff;
            padding: 16px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6);
        }
        .btn-social {
            background: #1e1e24;
            color: #ffffff;
            padding: 16px 25px;
            font-size: 1.1rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.3s, border 0.3s, transform 0.2s;
        }
        .btn-social:hover {
            background: #272730;
            border-color: #a855f7;
            transform: translateY(-3px);
        }
        .btn-discord:hover {
            color: #5865F2;
            border-color: #5865F2;
        }
        .btn-tiktok:hover {
            color: #ff0050;
            border-color: #ff0050;
        }
        /* Stats Leiste (Wie bei Profi-Clients) */
        .stats-container {
            display: flex;
            gap: 60px;
            margin-top: 60px;
            background: rgba(255, 255, 255, 0.02);
            padding: 20px 50px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-box {
            text-align: center;
        }
        .stat-val {
            font-size: 2rem;
            font-weight: 800;
            color: #a855f7;
        }
        .stat-lbl {
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Hintergrund-Partikel -->
    <div id="particles-js"></div>

    <!-- Navigation Header -->
    <nav>
        <div class="logo-area">
            <div class="logo-icon">U</div>
            <div class="logo-text">UltraClient</div>
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Cosmetics</a></li>
            <li><a href="#">Store</a></li>
            <li><a href="#">Discord</a></li>
        </ul>
    </nav>

    <!-- Hauptinhalt (Hero Section) -->
    <div class="hero">
        <div class="badge">🔥 Next Generation Minecraft Client</div>
        <h1>UltraClient</h1>
        <p>Erlebe Minecraft mit maximalen FPS, perfekter Performance und exklusiven Cosmetics. Ein völlig neues Spielgefühl.</p>
        
        <div class="btn-container">
            <button class="btn-main" onclick="alert('Der Launcher wird aktuell noch mit viel Liebe programmiert!')">
                <i class="fa-solid fa-download"></i> Launcher Coming Soon
            </button>
            
            <!-- HIER DEINEN DISCORD-LINK BEI href EINTRAGEN -->
            <a href="https://discord.gg" target="_blank" class="btn-social btn-discord">
                <i class="fa-brands fa-discord"></i> Discord Server
            </a>
            
            <!-- HIER DEINEN TIKTOK-LINK BEI href EINTRAGEN -->
            <a href="https://tiktok.com" target="_blank" class="btn-social btn-tiktok">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </a>
        </div>

        <!-- Performance Stats -->
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-val">+45%</div>
                <div class="stat-lbl">Mehr FPS</div>
            </div>
            <div class="stat-box">
                <div class="stat-val">&lt; 5ms</div>
                <div class="stat-lbl">Ping Delay</div>
            </div>
            <div class="stat-box">
                <div class="stat-val">100%</div>
                <div class="stat-lbl">Kostenlos</div>
            </div>
        </div>
    </div>

    <!-- Script für die coolen Hintergrundpartikel -->
    <script src="https://jsdelivr.net"></script>
    <script>
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#a855f7" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3, "random": true },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#6366f1", "opacity": 0.15, "width": 1 },
                "move": { "enable": true, "speed": 1.5, "direction": "none", "random": true, "straight": false }
            },
            "interactivity": {
                "events": { "onhover": { "enable": true, "mode": "repulse" } }
            }
        });
    </script>
</body>
</html>
