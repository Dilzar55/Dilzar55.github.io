<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraClient | Next-Gen Minecraft Client Experience</title>
    
    <!-- Professionelle Google Gaming-Fonts -->
    <link href="https://cdnfonts.com" rel="stylesheet">
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- FontAwesome für moderne Gaming-Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* 100% Komplett neues CSS-Layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #020205;
            color: #f1f5f9;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 🌐 Interaktives Partikel-Netzwerk im Hintergrund */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            background: radial-gradient(circle at 50% 50%, #0b071e 0%, #020205 100%);
        }

        /* 📱 High-End Navigation im Esports-Look */
        nav {
            position: fixed;
            top: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            background: rgba(2, 2, 5, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(140, 82, 255, 0.3);
            z-index: 100;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-box {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #00d4ff, #8c52ff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Minecraftia', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(140, 82, 255, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ffffff 30%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 35px;
        }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .nav-links a:hover {
            color: #00d4ff;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
        }
        .nav-links .locked {
            color: #334155;
            cursor: not-allowed;
        }

        /* 👑 Brandneue Hero-Sektion */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 140px 20px 60px 20px;
        }

        .premium-tag {
            background: linear-gradient(90deg, rgba(0, 212, 255, 0.2), rgba(140, 82, 255, 0.2));
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 6px 20px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .main-wrapper h1 {
            font-family: 'Minecraftia', sans-serif;
            font-size: 5.5rem;
            margin-bottom: 20px;
            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 40px rgba(140, 82, 255, 0.4));
        }

        .main-wrapper p {
            color: #94a3b8;
            font-size: 1.5rem;
            max-width: 750px;
            line-height: 1.5;
            margin-bottom: 45px;
            font-weight: 500;
        }

        /* 🎯 Komplett neue Gaming-Buttons */
        .action-area {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 70px;
        }
        .btn-dev {
            background: #1e1b4b;
            color: #a78bfa;
            padding: 18px 40px;
            font-size: 1.25rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            border: 1px solid #6d28d9;
            border-radius: 8px;
            cursor: not-allowed;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: inset 0 0 15px rgba(109, 40, 217, 0.3);
        }
        .btn-tiktok-glow {
            background: linear-gradient(135deg, #ff0050 0%, #00f2fe 100%);
            color: #ffffff;
            padding: 18px 40px;
            font-size: 1.25rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 30px rgba(255, 0, 80, 0.4);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .btn-tiktok-glow:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.8);
        }

        /* 📊 Esports-Style Dashboard Boxen (Glassmorphism) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1000px;
            margin-top: 20px;
        }
        .dash-card {
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .dash-card:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.02);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.1);
        }
        .dash-card i {
            font-size: 2.2rem;
            color: #8c52ff;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(140, 82, 255, 0.5);
        }
        .dash-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .dash-desc {
            color: #64748b;
            font-size: 1.05rem;
            font-weight: 600;
        }
    </style>
</head>
