<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraClient | Next-Gen Minecraft Launcher</title>
    
    <!-- 🖼️ HIER WIRD DEIN LOGO OBEN IM BROWSER-TAB EINGEBUNDEN -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- Schriftarten & Icons -->
    <link href="https://cdnfonts.com" rel="stylesheet">
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #030208;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 🌌 Epischer, animierter CGI-Weltraum-Hintergrund */
        .cosmic-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(140, 82, 255, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
                linear-gradient(145deg, #070412 0%, #030208 100%);
            z-index: -2;
        }

        /* Animierte Hyperraum-Sterne */
        .stars-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 45px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            background-position: 0 0, 40px 60px;
            opacity: 0.25;
            animation: warpSpeed 90s linear infinite;
            z-index: -1;
        }

        @keyframes warpSpeed {
            from { background-position: 0 0, 40px 60px; }
            to { background-position: 550px 1100px, 350px 700px; }
        }

        /* 📱 High-Tech Navigationsleiste */
        nav {
            position: fixed;
            top: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 6%;
            background: rgba(3, 2, 8, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(140, 82, 255, 0.2);
            z-index: 100;
            box-shadow: 0 5px 30px rgba(0,0,0,0.5);
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        /* 🖼️ LOGO OBEN LINKS AUF DER WEBSEITE */
        .nav-logo-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #8c52ff;
            box-shadow: 0 0 15px rgba(140, 82, 255, 0.6);
            object-fit: cover;
        }
        .logo-text {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, #8c52ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-links a:hover {
            color: #8c52ff;
            text-shadow: 0 0 10px rgba(140, 82, 255, 0.5);
        }
        .nav-links .locked {
            color: #47475a;
            cursor: not-allowed;
        }

        /* 👑 Hero-Sektion */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 150px 20px 80px 20px;
            position: relative;
        }

        /* Pulsierender Cyber-Badge */
        .cyber-badge {
            background: linear-gradient(90deg, rgba(140, 82, 255, 0.1), rgba(0, 212, 255, 0.1));
            border: 1px solid #8c52ff;
            color: #d6c2ff;
            padding: 8px 24px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(140, 82, 255, 0.3);
            margin-bottom: 35px;
            animation: cyberPulse 2.5s infinite alternate;
        }

        @keyframes cyberPulse {
            0% { box-shadow: 0 0 15px rgba(140, 82, 255, 0.2); border-color: #8c52ff; }
            100% { box-shadow: 0 0 30px rgba(0, 212, 255, 0.5); border-color: #00d4ff; }
        }

        /* Große Minecraft-Überschrift */
        .hero h1 {
            font-family: 'Minecraftia', sans-serif;
            font-size: 5.5rem;
            margin-bottom: 25px;
            background: linear-gradient(to bottom, #ffffff 40%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 35px rgba(140, 82, 255, 0.5));
        }

        .hero p {
            color: #94a3b8;
            font-size: 1.35rem;
            max-width: 700px;
            line-height: 1.7;
            margin-bottom: 50px;
        }

        /* 🎯 Premium Buttons */
        .btn-group {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 70px;
        }
        .btn-launcher {
            background: linear-gradient(135deg, #8c52ff 0%, #451a99 100%);
            color: rgba(255,255,255,0.7);
            padding: 20px 45px;
            font-size: 1.2rem;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            cursor: not-allowed;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .btn-tiktok-premium {
            background: #ffffff;
            color: #000000;
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s;
        }
        .btn-tiktok-premium:hover {
            transform: translateY(-5px) scale(1.03);
            background: #ff0050;
            color: #ffffff;
            box-shadow: 0 15px 35px rgba(255, 0, 80, 0.6);
        }

        /* 📊 Sci-Fi Statistik-Gitter */
        .stats-grid {
            display: flex;
            gap: 30px;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(140, 82, 255, 0.2);
            padding: 30px 70px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 0 20px rgba(140, 82, 255, 0.1);
        }
        .stat-divider {
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(140, 82, 255, 0.5), transparent);
        }
        .stat-item {
            text-align: center;
            padding: 0 20px;
        }
        .stat-number {
            font-family: 'Syncopate', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        .stat-label {
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- Kosmische Effekte -->
    <div class="cosmic-bg"></div>
    <div class="stars-overlay"></div>

    <!-- 📱 Obere Navigationsleiste mit Logo -->
    <nav>
        <div class="logo-container">
            <!-- DEIN LOGO LINKS IN DER BAR -->
            <img src="logo.png" alt="UltraClient" class="nav-logo-img">
            <span class="logo-text">UltraClient</span>
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#" class="locked"><i class="fa-solid fa-lock"></i> Cosmetics</a></li>
            <li><a href="#" class="locked"><i class="fa-solid fa-lock"></i> Store</a></li>
            <li><a href="https://www.tiktok.com/@ultraclient2026" target="_blank"><i class="fa-brands fa-tiktok"></i> TikTok</a></li>
        </ul>
    </nav>

    <!-- 👑 Hauptseite -->
    <div class="hero">
        <div class="cyber-badge">Coming Soon</div>
        <h1>UltraClient</h1>
        <p>Der fortschrittlichste Minecraft Launcher der nächsten Generation. Erlebe maximale Stabilität, ein cleanes Interface und exklusive Cosmetics.</p>
        
        <div class="btn-group">
            <button class="btn-launcher" onclick="alert('Unser Entwickler-Team codet den Launcher gerade im Hintergrund!')">
                <i class="fa-solid fa-gears"></i> LAUNCHER IN ARBEIT
            </button>
