<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraClient | Minecraft that feels like it's truly built just for you.</title>
    
    <!-- Original Minecraft Pixel-Schriftart -->
    <link href="https://cdnfonts.com" rel="stylesheet">
    <!-- Elegante Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- FontAwesome Gaming Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #040406;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 🌌 Geisteskranker, animierter CGI-Nebel & Rauch im Hintergrund */
        .ambient-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% -20%, rgba(147, 51, 234, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 50% 120%, rgba(147, 51, 234, 0.12) 0%, transparent 50%),
                #040406;
            z-index: -2;
        }

        .canvas-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.45;
            filter: blur(40px);
            pointer-events: none;
        }

        /* 📱 High-End NoRisk Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 8%;
            z-index: 100;
        }
        .menu-btn {
            color: #71717a;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        .menu-btn:hover {
            color: #ffffff;
            transform: translateX(3px);
        }
        .menu-btn i {
            font-size: 0.9rem;
        }

        /* ⚡ Der pulsierende, neon-violette Blitz */
        .top-flash {
            font-size: 1.6rem;
            color: #a855f7;
            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.8));
            animation: flashGlow 4s infinite ease-in-out;
        }

        @keyframes flashGlow {
            0% { opacity: 0.7; transform: scale(1); filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5)); }
            50% { opacity: 1; transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(168, 85, 247, 1)); }
            100% { opacity: 0.7; transform: scale(1); filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5)); }
        }

        /* 👑 Zentrierter Premium-Inhalt */
        .main-content {
            text-align: center;
            padding: 0 20px;
            max-width: 900px;
            z-index: 10;
            transform: translateY(-20px);
        }

        /* Hauptüberschrift exakt formatiert */
        .main-content h1 {
            font-family: 'Minecraftia', sans-serif;
            font-size: 3.4rem;
            line-height: 1.5;
            font-weight: normal;
            color: #ffffff;
            margin-bottom: 24px;
            letter-spacing: -0.8px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .purple-glow-text {
            color: #a855f7;
            background: linear-gradient(135deg, #c084fc 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.6));
        }

        /* Eleganter Untertext */
        .main-content p {
            color: #52525b;
            font-size: 1.15rem;
            line-height: 1.6;
            max-width: 580px;
            margin: 0 auto 50px auto;
            font-weight: 500;
        }

        /* 🎯 Die High-End Buttons */
        .button-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .btn-norisk {
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            padding: 16px 42px;
            border: none;
            border-radius: 40px;
            cursor: not-allowed;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* TikTok-Link Untertitel */
        .btn-tiktok-sub {
            color: #52525b;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-tiktok-sub:hover {
            color: #ff0050;
            transform: scale(1.02);
            text-shadow: 0 0 15px rgba(255, 0, 80, 0.4);
        }
    </style>
</head>
<body>

    <!-- 🌌 CGI-Shader & Nebel-Hintergrund -->
    <div class="ambient-glow"></div>
    <div class="canvas-container">
        <canvas id="smoke-canvas"></canvas>
    </div>

    <!-- Navigationsleiste -->
    <nav>
        <div class="menu-btn"><i class="fa-solid fa-bars"></i> Menu</div>
        <div class="top-flash"><i class="fa-solid fa-bolt"></i></div>
        <div style="width: 80px;"></div>
    </nav>

    <!-- Hauptbereich -->
    <div class="main-content">
        <h1>Minecraft that feels like it's truly <br><span class="purple-glow-text">built just for you.</span></h1>
        <p>Everything you need to make Minecraft feel fresh, personal, and exciting again.</p>
        
        <div class="button-wrapper">
            <button class="btn-norisk" onclick="alert('UltraClient befindet sich aktuell in der Entwicklung! Check unser TikTok für exklusive Leaks!')">
                <i class="fa-solid fa-download"></i> Start Playing
            </button>
            
            <a href="https://tiktok.com" target="_blank" class="btn-tiktok-sub">
                <i class="fa-brands fa-tiktok"></i> Follow @ultraclient2026 for Dev-Logs
            </a>
        </div>
    </div>

    <!-- Script für den animierten Rauch im Hintergrund -->
    <script>
        const canvas = document.getElementById('smoke-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 150 + 100;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = Math.random() * 0.002 - 0.001;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.angle += this.spin;
                if (this.x < -this.size) this.x = width + this.size;
                if (this.x > width + this.size) this.x = -this.size;
                if (this.y < -this.size) this.y = height + this.size;
                if (this.y > height + this.size) this.y = -this.size;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                const gradient = ctx.createRadialGradient(0, 0, 10, 0, 0, this.size);
                gradient.addColorStop(0, 'rgba(147, 51, 234, 0.08)');
                gradient.addColorStop(0.5, 'rgba(59, 130, 246, 0.03)');
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const particles = Array.from({ length: 15 }, () => new Particle());

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
